<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-paper-scissor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="top">
            <h1>Rock Paper Scissors</h1>
        </div>
    </header>
    <main>
      <div class="content">
        <div class="box" id="rock"></div>
        <div class="box" id="paper"></div>
        <div class="box" id="scissor"></div>
      </div>
      <div class="scores">
        <div class="you">
            <p id="user-score">0</p>
            <p>You</p>
        </div>
        <div class="comp">
            <p id="comp-score">0</p>
            <p>Comp</p></div>
       </div>
      <div class="panel">
        <p id="message">Play your move</p>
      </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
